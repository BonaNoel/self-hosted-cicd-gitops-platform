name: pipeline-pilot CI

on:
  push:
    branches: ["**"]
    paths:
      - "apps/pipeline-pilot/**"
      - ".gitea/workflows/pipeline-pilot-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Maven
        run: apt-get update && apt-get install -y --no-install-recommends maven

      - name: Run tests
        working-directory: apps/pipeline-pilot
        run: mvn -B verify

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Docker CLI
        run: apt-get update && apt-get install -y --no-install-recommends docker.io

      - name: Configure registry credentials
        # `docker login` doesn't reliably honor daemon insecure-registries for TLS-mismatched hosts; write creds directly instead
        run: |
          mkdir -p ~/.docker
          AUTH=$(printf '%s:%s' "${{ secrets.REGISTRY_USERNAME }}" "${{ secrets.REGISTRY_PASSWORD }}" | base64 -w0)
          printf '{"auths":{"gitea.local":{"auth":"%s"}}}' "$AUTH" > ~/.docker/config.json

      - name: Build image
        working-directory: apps/pipeline-pilot
        run: docker build -t gitea.local/gitea_admin/pipeline-pilot:${{ gitea.sha }} -t gitea.local/gitea_admin/pipeline-pilot:latest .

      - name: Push image
        run: |
          docker push gitea.local/gitea_admin/pipeline-pilot:${{ gitea.sha }}
          docker push gitea.local/gitea_admin/pipeline-pilot:latest
