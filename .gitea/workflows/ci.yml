name: ci-mvp

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: maven
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          set -euo pipefail
          cd apps/pipeline-pilot
          mvn -B -ntp clean test

  build-push-image:
    if: ${{ gitea.event_name == 'push' }}
    needs:
      - build-test
    runs-on: docker
    env:
      IMAGE_REPO: localhost:5000/pipeline-pilot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and push image
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          docker build -t "$IMAGE_REPO:$short_sha" ./apps/pipeline-pilot
          docker push "$IMAGE_REPO:$short_sha"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            docker tag "$IMAGE_REPO:$short_sha" "$IMAGE_REPO:latest"
            docker push "$IMAGE_REPO:latest"
          fi