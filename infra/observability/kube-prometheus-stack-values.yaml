grafana:
  adminPassword: ChangeMe123!
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.local
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
  deleteDatasources:
    - name: Loki
      orgId: 1
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.observability.svc.cluster.local:3100
      isDefault: false

prometheus:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - prometheus.local
  prometheusSpec:
    additionalScrapeConfigs:
      - job_name: pipeline-pilot
        metrics_path: /actuator/prometheus
        static_configs:
          - targets:
              - pipeline-pilot.dev.svc.cluster.local:80
            labels:
              service: pipeline-pilot
              environment: development