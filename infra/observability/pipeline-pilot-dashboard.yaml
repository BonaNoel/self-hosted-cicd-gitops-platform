apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-pilot-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  pipeline-pilot-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "sum(rate(http_server_requests_seconds_count{job=\"pipeline-pilot\"}[1m]))", "legendFormat": "Requests/s", "refId": "A"}],
          "title": "HTTP Request Rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "description": "When the request rate is zero, 0.2s is displayed as an idle marker; it is not a measured request latency.",
          "targets": [{"expr": "((sum(rate(http_server_requests_seconds_sum{job=\"pipeline-pilot\"}[1m])) / sum(rate(http_server_requests_seconds_count{job=\"pipeline-pilot\"}[1m]))) and on() (sum(rate(http_server_requests_seconds_count{job=\"pipeline-pilot\"}[1m])) > 0)) or vector(0.2)", "legendFormat": "Average latency / idle marker", "refId": "A"}],
          "title": "HTTP Average Latency (idle marker: 0.2s)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "targets": [{"expr": "sum(jvm_memory_used_bytes{job=\"pipeline-pilot\",area=\"heap\"}) / sum(jvm_memory_max_bytes{job=\"pipeline-pilot\",area=\"heap\"})", "legendFormat": "Heap utilization", "refId": "A"}],
          "title": "JVM Heap Utilization",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"unit": "percentunit", "min": 0, "max": 1}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"dev\",pod=~\"pipeline-pilot-.*\",container!=\"\"}[1m])) / sum(kube_pod_container_resource_requests{namespace=\"dev\",pod=~\"pipeline-pilot-.*\",container=\"pipeline-pilot\",resource=\"cpu\",unit=\"core\"})", "legendFormat": "CPU utilization", "refId": "A"}],
          "title": "Application CPU Utilization",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"decimals": 0, "min": 0}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 16},
          "id": 6,
          "targets": [{"expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"dev\",horizontalpodautoscaler=\"pipeline-pilot\"}", "legendFormat": "Current", "refId": "A"}, {"expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"dev\",horizontalpodautoscaler=\"pipeline-pilot\"}", "legendFormat": "Desired", "refId": "B"}],
          "title": "HPA Current and Desired Replicas",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"decimals": 0, "min": 0}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 16},
          "id": 7,
          "targets": [{"expr": "kube_deployment_status_replicas_available{namespace=\"dev\",deployment=\"pipeline-pilot\"}", "legendFormat": "Available", "refId": "A"}, {"expr": "kube_deployment_spec_replicas{namespace=\"dev\",deployment=\"pipeline-pilot\"}", "legendFormat": "Desired", "refId": "B"}],
          "title": "Deployment Availability",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {"defaults": {"decimals": 0, "min": 0}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 16},
          "id": 8,
          "targets": [{"expr": "sum(kube_pod_container_status_restarts_total{namespace=\"dev\",pod=~\"pipeline-pilot-.*\"})", "legendFormat": "Restarts", "refId": "A"}],
          "title": "Application Container Restarts",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "loki", "uid": "loki"},
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 24},
          "id": 5,
          "options": {"dedupStrategy": "none", "enableLogDetails": true, "prettifyLogMessage": false, "showCommonLabels": false, "showLabels": false, "showTime": true, "sortOrder": "Descending", "wrapLogMessage": true},
          "targets": [{"expr": "{namespace=\"dev\"}", "refId": "A"}],
          "title": "Development Workload Logs",
          "type": "logs"
        }
      ],
      "refresh": "5s",
      "schemaVersion": 39,
      "tags": ["pipeline-pilot", "thesis"],
      "templating": {"list": []},
      "time": {"from": "now-15m", "to": "now"},
      "title": "Pipeline Pilot Overview",
      "uid": "pipeline-pilot-overview",
      "version": 5
    }
