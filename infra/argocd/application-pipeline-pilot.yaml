apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pipeline-pilot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://gitea.local/gitea_admin/MSc-thesis.git
    targetRevision: development
    path: apps/pipeline-pilot/helm/pipeline-pilot
    helm:
      valueFiles:
        - values.yaml
        - image-tag.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
