apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-pilot
  labels:
    app: pipeline-pilot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pipeline-pilot
  template:
    metadata:
      labels:
        app: pipeline-pilot
    spec:
      containers:
        - name: pipeline-pilot
          image: localhost:5000/pipeline-pilot:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
